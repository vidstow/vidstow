<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VidStow — prototype 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650&family=Geist+Mono:wght@450;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090B; --sidebar: #0C0C0E; --base: #111113; --raised: #18181B;
      --hover: #1F1F23; --border: #27272A; --border-strong: #3F3F46;
      --text: #FAFAFA; --secondary: #A1A1AA; --muted: #8F8F99;
      --accent: #3B82F6; --accent-2: #2563EB; --accent-soft: rgba(59,130,246,0.12);
      --green: #22C55E; --red: #EF4444; --amber: #D9A62E;
      --sans: Geist, ui-sans-serif, system-ui, sans-serif;
      --mono: "Geist Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: radial-gradient(1200px 700px at 50% 30%, #0D0D11, #050506);
      color: var(--text); font-family: var(--sans); font-size: 13px;
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .desktop { height: 100vh; display: grid; place-items: center; }
    .app {
      position: relative; width: min(1180px, calc(100vw - 48px)); height: min(760px, calc(100vh - 40px));
      display: grid; grid-template-rows: 40px 1fr 24px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .titlebar {
      display: flex; align-items: center; gap: 12px; padding: 0 14px;
      border-bottom: 1px solid var(--border); background: var(--sidebar);
      user-select: none;
    }
    .lights { display: flex; gap: 7px; }
    .lights i { width: 11px; height: 11px; border-radius: 50%; display: block; }
    .lights i:nth-child(1) { background: #EF4444; }
    .lights i:nth-child(2) { background: #F59E0B; }
    .lights i:nth-child(3) { background: #22C55E; }
    .wtitle { font-size: 12px; font-weight: 600; color: var(--text); }

    .shell { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
    .sidebar {
      display: flex; flex-direction: column; gap: 2px; padding: 10px 8px;
      border-right: 1px solid var(--border); background: var(--sidebar);
    }
    .brand { display: flex; align-items: center; gap: 8px; margin: 2px 6px 12px; font-weight: 650; font-size: 13px; }
    .brand .mark {
      width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px;
      background: linear-gradient(180deg, #3B82F6, #1D4ED8);
    }
    .brand .mark svg {
      width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item {
      position: relative; display: flex; align-items: center; gap: 9px;
      height: 30px; padding: 0 9px 0 11px; border-radius: 7px;
      color: var(--secondary); font-size: 13px; text-align: left; width: 100%;
      transition: background-color 120ms ease, color 120ms ease;
    }
    .nav-item:hover { background: var(--raised); color: var(--text); }
    .nav-item.active { background: var(--raised); color: var(--text); }
    .nav-item.active:hover { background: var(--raised); color: var(--text); }
    .nav-item.active::before {
      content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px;
      border-radius: 99px; background: var(--accent);
    }
    .nav-item svg {
      width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-item .badge {
      margin-left: auto; min-width: 17px; height: 17px; padding: 0 5px;
      display: grid; place-items: center; border-radius: 99px;
      background: #27272A; font-size: 10px; color: var(--secondary);
    }
    .nav-item .badge.new { background: var(--accent-2); color: #fff; }
    .nav-item .badge.pulse { animation: badgepulse 700ms ease; }
    @keyframes badgepulse { 0% { transform: scale(1); } 35% { transform: scale(1.45); background: #22C55E; color: #fff; } 100% { transform: scale(1); } }
    .nav-item[data-tip]:hover::after {
      content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%;
      transform: translateY(-50%); padding: 4px 9px; border-radius: 6px;
      background: #101012; border: 1px solid var(--border-strong);
      color: var(--secondary); font-size: 11px; white-space: nowrap; z-index: 60;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55); pointer-events: none;
    }
    .nav-gap { flex: 1; }
    #nav-utility { padding-top: 8px; border-top: 1px solid var(--border); }

    main { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
    .screen { position: absolute; inset: 0; display: none; opacity: 0; }
    .screen.active { display: block; opacity: 1; transition: opacity 140ms ease; }

    .statusbar {
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
      border-top: 1px solid var(--border); background: #0A0A0C;
      color: var(--muted); font-size: 10px; font-family: var(--mono);
    }
    .statusbar .live { color: #60A5FA; }

    /* Buttons */
    .btn {
      height: 28px; padding: 0 12px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--raised); color: var(--text);
      font-size: 12px; font-weight: 500;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .btn:hover:not(:disabled) { background: var(--hover); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.pri { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
    .btn.pri:hover:not(:disabled) { background: #1D4ED8; }
    .btn.query { background: #FAFAFA; border-color: #FAFAFA; color: #09090B; font-weight: 600; }
    .btn.query:hover:not(:disabled) { background: #E4E4E7; border-color: #E4E4E7; }
    .btn.query.dim { opacity: 0.45; }
    .btn.ghost { background: transparent; }
    .btn.sm { height: 24px; padding: 0 9px; font-size: 11px; border-radius: 6px; }
    .btn.danger { color: #FCA5A5; }

    /* ============ HOME ============ */
    .tx { width: min(780px, 84%); margin: 44px auto 0; }
    .fieldwrap {
      display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px 0 14px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--base);
      transition: border-color 120ms ease;
    }
    .fieldwrap:focus-within { border-color: var(--accent); }
    .fieldwrap input {
      flex: 1; min-width: 0; background: none; border: 0; color: var(--text);
      font-family: inherit; font-size: 14px;
    }
    .fieldwrap input::placeholder { color: var(--muted); }
    .fieldwrap .kbd {
      padding: 2px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px;
      border-radius: 5px; background: var(--raised); color: var(--secondary);
      font-family: var(--mono); font-size: 10px;
    }
    .slot { min-height: 84px; margin-top: 12px; }
    .hint { padding: 14px 4px 0; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.7; }
    .hint .try { color: var(--secondary); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
    .hint .try:hover { color: var(--text); }

    .skel { padding: 12px 14px; border: 1px dashed #2A2A30; border-radius: 10px; }
    .sklab { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .skrow { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; }
    .skth { width: 84px; height: 47px; border-radius: 6px; background: #1B1B1F; }
    .skbar { height: 8px; border-radius: 99px; background: #1B1B1F; overflow: hidden; }
    .skbar.short { width: 46%; margin-top: 7px; }
    .skbar i { display: block; height: 100%; width: 100%; background: #26262C; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

    .dock {
      display: grid; grid-template-columns: 96px minmax(0,1fr) auto auto; gap: 14px; align-items: center;
      padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--raised);
      animation: fadein 150ms ease;
    }
    .dth { width: 160px; height: 90px; border-radius: 8px; object-fit: cover; display: block; }
    .dock2.v2 .dth { width: 200px; height: 100%; min-height: 150px; }
    .dock2.v2 .dth.cnt2 { font-size: 28px; }
    .dth.cnt2 { display: grid; place-items: center; background: var(--base); border: 1px solid var(--border); color: #93C5FD; font-weight: 700; font-size: 26px; }
    .dock .dmain { min-width: 0; }
    .dock .dmain b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dock .dmain span { display: block; color: var(--secondary); font-size: 12px; margin-top: 3px; }
    .segs { display: flex; gap: 4px; }
    .seg {
      height: 26px; padding: 0 11px; display: inline-flex; align-items: justify-content: center;
      align-items: center; border: 1px solid var(--border); border-radius: 7px;
      background: var(--base); color: var(--secondary); font-size: 12px;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    }
    .seg:hover { border-color: var(--border-strong); color: var(--text); }
    .seg.on { border-color: rgba(59,130,246,0.55); background: var(--accent-soft); color: #93C5FD; }

    .dock2 { display: flex; flex-direction: column; padding: 16px 16px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--raised); animation: fadein 150ms ease; position: relative; }
    .drow2 { display: grid; grid-template-columns: 160px minmax(0,1fr) auto; gap: 16px; align-items: stretch; }
    .dchoice { display: flex; flex-direction: column; gap: 6px; justify-self: end; align-items: flex-end; padding-top: 1px; }
    .dchoice .segs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .dock2.v2 { padding: 16px; }
    .dock2.v2 .drow2 { grid-template-columns: 200px minmax(0,1fr) auto; align-items: stretch; }
    .dock2.v2 .dchoice { gap: 12px; justify-content: space-between; }
    .dock2.v2 .dchoice .col { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .dock2.v2 .dchoice .chips { flex-direction: column; align-items: flex-end; gap: 4px; }
    .dock2.v2 .dchoice .btn { width: 100%; }
    .dmain2 { min-width: 0; display: flex; flex-direction: column; }
    .doutcome { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .doutcome .dcost { color: var(--secondary); font-weight: 600; }
    .dpolhint { font-size: 10.5px; color: var(--muted); margin-top: 4px; }
    .dtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dtop b { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modeseg { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; flex-shrink: 0; }
    .modeseg button { height: 24px; padding: 0 11px; font-size: 11.5px; color: var(--muted); background: var(--base); }
    .modeseg button + button { border-left: 1px solid var(--border); }
    .modeseg button.on { background: var(--accent-soft); color: #93C5FD; }
    .dmain2 .dmeta { display: block; color: var(--secondary); font-size: 12px; margin-top: 3px; }
    .seg.rec::after { content: ''; display: inline-block; width: 4px; height: 4px; border-radius: 99px; background: var(--accent-2); margin-left: 5px; vertical-align: 1px; }
    .ddisc { display: flex; align-items: baseline; gap: 10px; margin: auto -8px 0; border: 0; background: none; padding: 5px 8px; border-radius: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); width: 100%; text-align: left; flex-wrap: wrap; row-gap: 2px; }
    .ddisc.has { cursor: pointer; }
    .ddisc.has:hover { background: var(--base); }
    .ddisc .cov { color: var(--secondary); }
    .ddisc .cov.part { color: #FBBF24; }
    .ddisc .cost { color: var(--secondary); font-weight: 600; font-variant-numeric: tabular-nums; }
    .ddisc .dlnk { color: #93C5FD; white-space: nowrap; }
    .ddisc.has:hover .dlnk { text-decoration: underline; }
    .ddisc.has:hover .cov, .ddisc.has:hover .cost { color: var(--text); }
    .ddisc.has:hover .dp { color: var(--secondary); }
    .ddisc.has:hover .cov.part { color: #FCD34D; }
    .ddisc .chev { font-size: 9px; color: var(--muted); transition: transform 120ms ease; align-self: center; }
    .ddisc.has[aria-expanded="true"] .chev { transform: rotate(90deg); }
    .dfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px -16px 0; padding: 10px 16px; border-top: 1px solid var(--border); border-radius: 0 0 9px 9px; background: var(--base); }
    .dock2.v2 .dfoot { margin: 14px -16px -16px; }
    .dfoot .btn { flex-shrink: 0; }
    .dpath { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dleft { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .flink { border: 0; background: none; padding: 0; font-size: 11px; color: #93C5FD; cursor: pointer; flex-shrink: 0; }
    .flink:hover { text-decoration: underline; }
    .fpop { position: absolute; left: 16px; bottom: 48px; width: 300px; padding: 8px; border: 1px solid var(--border-strong); border-radius: 10px; background: #141416; box-shadow: 0 12px 32px rgba(0,0,0,0.55); z-index: 60; animation: fadein 150ms ease; }
    .fcrumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 2px 9px 8px; font-family: var(--mono); font-size: 11px; }
    .fcrumb { border: 0; background: none; padding: 0; font: inherit; color: #93C5FD; cursor: pointer; }
    .fcrumb:hover { text-decoration: underline; }
    .fcrumb:last-child { color: var(--text); cursor: default; }
    .fcrumb:last-child:hover { text-decoration: none; }
    .fsep { color: var(--muted); }
    .flist { display: flex; flex-direction: column; max-height: 168px; overflow-y: auto; border-top: 1px solid var(--border); }
    .fitem { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px 9px; border: 0; background: none; font-family: var(--mono); font-size: 11px; color: var(--secondary); cursor: pointer; }
    .fitem:hover { background: var(--base); color: var(--text); }
    .fempty { padding: 12px 9px; color: var(--muted); font-size: 11px; }
    .fnew { display: flex; padding: 6px 9px 0; border-top: 1px solid var(--border); }
    .fbtns { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 9px 2px; }
    .prow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 9px 12px; cursor: pointer; }
    .prow:hover { background: #131316; }
    .prow.sel { background: rgba(37,99,235,0.12); }
    .prow b { font-size: 12.5px; font-weight: 600; }
    .prow b em { font-style: normal; color: #93C5FD; font-size: 10px; margin-left: 7px; font-weight: 500; }
    .prow span { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .prow .psize { font-family: var(--mono); font-size: 11px; color: var(--secondary); }

    .blist { margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--base); overflow: hidden; animation: fadein 150ms ease; }
    .brow { display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 12px; align-items: center; padding: 8px 12px; }
    .brow + .brow { border-top: 1px solid var(--border); }
    .brow img { width: 48px; height: 28px; border-radius: 4px; object-fit: cover; display: block; }
    .brow b { display: block; font-size: 12.5px; font-weight: 500; }
    .brow span { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .eplist { margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--base); overflow: hidden; animation: fadein 150ms ease; }
    .ephead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--raised); border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--secondary); flex-wrap: wrap; }
    .ephead .lnk { display: flex; gap: 12px; }
    .ephead .lnk button { border: 0; background: none; padding: 0; font-size: 11.5px; color: #93C5FD; cursor: pointer; }
    .ephead .lnk button:hover { text-decoration: underline; }
    .ephead .rng { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .ephead .rng input { width: 46px; height: 22px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--base); color: var(--text); font-family: var(--mono); font-size: 11px; }
    .ephead .rng input:focus { border-color: var(--accent); outline: none; }
    .ephead .rng .warn { color: #FBBF24; font-size: 10.5px; }
    .epscroll { max-height: 268px; overflow-y: auto; }
    .eprow { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 6px 12px; font-size: 12px; color: var(--secondary); cursor: pointer; }
    .eprow:hover { background: var(--raised); }
    .eprow + .eprow { border-top: 1px solid var(--border); }
    .eprow .chk { width: 12px; height: 12px; border: 1px solid var(--border-strong); border-radius: 3px; }
    .eprow.sel .chk { background: var(--accent-2); border-color: var(--accent-2); }
    .eprow b { font-weight: 500; color: var(--text); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eprow .epd { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
    .eprow.unsel b, .eprow.unsel .epd { opacity: 0.5; }

    .errslot { padding: 14px 16px; border: 1px solid rgba(239,68,68,0.45); border-radius: 10px; background: rgba(239,68,68,0.06); animation: fadein 150ms ease; }
    .errslot b { display: block; font-size: 13px; font-weight: 600; color: #FCA5A5; }
    .errslot span { display: block; color: var(--secondary); font-size: 12px; margin-top: 3px; }
    .sdialog { padding: 16px 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--raised); animation: fadein 150ms ease; }
    .sdialog b { display: block; font-size: 13px; font-weight: 600; }
    .sdialog .dsub { display: block; color: var(--secondary); font-size: 12px; margin-top: 3px; }
    .scard { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 14px; align-items: center; width: 100%; text-align: left; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--base); cursor: pointer; font: inherit; }
    .scard:hover { background: var(--raised); border-color: var(--border-strong); }
    .scard img { width: 96px; height: 54px; border-radius: 6px; object-fit: cover; display: block; }
    .scard .sc-t { display: block; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scard .sc-m { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; font-family: var(--mono); }
    .scard .sc-k { display: block; font-size: 9.5px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .scard .sthumb { position: relative; display: block; width: 96px; height: 54px; }
    .scard .sthumb img { position: relative; z-index: 1; }
    .scard .sthumb::before, .scard .sthumb::after { content: ''; position: absolute; inset: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--base); }
    .scard .sthumb::before { transform: translate(5px, 5px); }
    .scard .sthumb::after { transform: translate(2.5px, 2.5px); }
    .scard .scnt { position: absolute; z-index: 2; right: 3px; bottom: 3px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.78); color: #fff; font-size: 10px; font-weight: 600; font-family: var(--mono); }
    .scard.pri { border-color: var(--accent); }
    .scard.pri:hover { border-color: #60A5FA; }
    .sdlg-foot { display: flex; justify-content: flex-end; margin-top: 10px; color: var(--muted); font-size: 10.5px; }
    .swapline { display: flex; align-items: center; gap: 6px; margin: 7px -8px 0; padding: 4px 8px; border: 0; background: none; border-radius: 6px; font: inherit; font-size: 11px; color: var(--muted); text-align: left; cursor: pointer; min-width: 0; }
    .swapline:hover { background: var(--base); }
    .swapline b { font-weight: 500; color: #93C5FD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .swapline:hover b { text-decoration: underline; }
    .swapline .arr { color: var(--muted); font-size: 10px; flex-shrink: 0; }
    .doneline { padding: 16px 4px 0; color: #86EFAC; font-size: 13px; text-align: center; animation: fadein 150ms ease; }
    .dolink { border: 0; background: none; padding: 0; margin-left: 8px; font: inherit; font-size: 12.5px; color: #93C5FD; cursor: pointer; }
    .dolink:hover { text-decoration: underline; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    /* ============ QUEUE ============ */
    .qwrap { display: grid; grid-template-columns: minmax(0,1fr) 300px; height: 100%; }
    .qmaster { display: flex; flex-direction: column; min-width: 0; }
    .qhead { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; }
    .qhead h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
    .qhead .acts { display: flex; gap: 6px; }
    .qlist { flex: 1; overflow-y: auto; padding: 0 10px 14px; }
    .qrow {

    const slug = j.item.title.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    const prior = state.downloads.filter(d => d.item.id === j.item.id).length;
    state.downloads.unshift({ item: j.item, fmt: j.fmt, sizeMB: j.sizeMB, group: 'today' });
    if (!j.colId) {
      toast({
        title: j.item.title,
        sub: prior > 0 ? `Finished · saved as ${slug}-${prior}.${ext} — the name already existed` : `Finished · ${state.folder}`,
        actions: [
          { label: 'Open', primary: true, onClick: () => toast({ title: 'Opened in default player', ms: 2500 }) },
          { label: 'Reveal', onClick: () => toast({ title: 'Revealed in Finder', ms: 2500 }) },
          { label: 'Dismiss' }
        ]
      });
    } else {
      const c = colById(j.colId);
      if (c && c.children.every(id => { const k = jobById(id); return !k || k.phase === 'done'; })) {
        const kids = c.children.map(id => jobById(id)).filter(Boolean).sort((a, b) => (a.epIndex || 0) - (b.epIndex || 0));
        state.dgroups.unshift({ id: 'dg' + (state.seq++), title: c.title, channel: c.channel, thumb: (c.eps && c.eps[0].thumb) || kids[0].item.thumb, fmt: c.fmt, items: kids.map(k => ({ item: k.item, fmt: k.fmt, sizeMB: k.sizeMB, idx: k.epIndex || 0 })), group: 'today', open: false });
        cancelCollection(c);
        toast({ title: c.title, sub: `Playlist finished · ${c.children.length} files`, actions: [{ label: 'Open folder', primary: true, onClick: () => toast({ title: 'Revealed in Finder', ms: 2500 }) }, { label: 'Dismiss' }] });
      }
    }
  }

  /* ---------- QUEUE render ---------- */
  const qEl = $('#scr-queue');
  const tailFor = j => {
    if (j.phase === 'downloading') return `${j.speed.toFixed(1)} MB/s · ${etaFor(j)}`;
    if (j.phase === 'merging') return `merging · ${Math.max(1, Math.round(j.mergeT * 0.6))}s`;
    if (j.phase === 'waiting') return 'waiting · slot';
    if (j.phase === 'waiting-drive') return `waiting for \u201C${j.vol || 'the drive'}\u201D\u2026`;
    if (j.phase === 'paused') return 'paused';
    if (j.phase === 'failed') return 'rate-limited · 429';
    return '';
  };
  const etaFor = j => {
    const s = (100 - j.progress) / j.rate * 0.6;
    return s < 90 ? `~${Math.max(1, Math.round(s))}s` : `~${Math.max(1, Math.round(s / 60))}m`;
  };
  function colStats(c) {
    const kids = c.children.map(jobById).filter(Boolean);
    const done = kids.filter(k => k.phase === 'done').length;
    const speed = kids.filter(k => k.phase === 'downloading').reduce((s, k) => s + k.speed, 0);
    const agg = kids.length ? kids.reduce((s, k) => s + k.progress, 0) / kids.length : 0;
    const anyActive = kids.some(k => ['downloading', 'merging', 'waiting'].includes(k.phase));
    return { kids, done, speed, agg, anyActive };
  }
  function rowJob(j) {
    const sel = state.sel && state.sel.type === 'job' && state.sel.id === j.id;
    return `<div class="qrow ${sel ? 'sel' : ''} ${j.phase === 'failed' ? 'fail' : ''}${j.phase === 'waiting-drive' ? ' wait' : ''}" data-job="${j.id}" tabindex="0">
      <div class="qth"><img src="${j.item.thumb}" alt=""></div>
      <div class="qmid"><span class="qt">${j.item.title}</span><span class="qbar"><i style="width:${j.progress}%"></i></span></div>
      <span class="qtail ${j.phase === 'failed' ? 'err' : ''}">${tailFor(j)}</span></div>`;
  }
  function rowCol(c) {
    const sel = state.sel && state.sel.type === 'col' && state.sel.id === c.id;
    const s = colStats(c);
    const tail = s.anyActive ? `${s.done}/${s.kids.length} · ${s.speed.toFixed(1)} MB/s` : `${s.done}/${s.kids.length} · paused`;
    return `<div class="qrow ${sel ? 'sel' : ''}" data-col="${c.id}" tabindex="0">
      <div class="qth"><span class="cnt">${c.children.length}</span></div>
      <div class="qmid"><span class="qt">${c.title}</span><span class="qbar"><i style="width:${s.agg}%"></i></span></div>
      <span class="qtail">${tail}</span></div>`;
  }
  function orphanCard() {
    if (!state.orphans.length) return '';
    const n = state.orphans.length;
    return `<div class="orphan">
      <div class="oh"><b><span class="odot"></span>${n} unfinished download${n > 1 ? 's' : ''} from last time</b>
        <div style="display:flex;gap:6px"><button class="btn sm ghost" data-or="dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 1.8"/></svg>Leave for now</button><button class="btn sm pri" data-or="resume-all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l11-6.5Z"/></svg>Resume all</button></div></div>
      ${state.orphans.map(o => `<div class="orow ${o.confirm ? 'odim' : ''}">
        <img src="${o.item.thumb}" alt="">
        <div class="omid"><span class="qt2">${o.item.title}</span><span class="ometa">${fmtSize(o.stagedMB)} staged · ${o.pct}% downloaded</span></div>
        <div class="oact">${o.confirm
          ? `<span class="oconfirm">delete ${fmtSize(o.stagedMB)}?</span><button class="btn sm ghost" data-or="keep" data-oid="${o.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h10a5 5 0 0 1 0 10h-4"/><path d="M8 6 4 10l4 4"/></svg>Keep</button><button class="btn sm danger" data-or="discard" data-oid="${o.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5"/><path d="M14 11v5.5"/></svg>Yes, discard</button>`
          : `<button class="btn sm ghost" data-or="discard" data-oid="${o.id}" data-arm="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5"/><path d="M14 11v5.5"/></svg>Discard</button><button class="btn sm" data-or="resume" data-oid="${o.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l11-6.5Z"/></svg>Resume</button>`}</div>
      </div>`).join('')}
    </div>`;
  }
  function orphanJob(o) {
    const j = addJob(o.item, { label: o.item.fmt || '1080p', sizeMB: o.totalMB || Math.round(o.stagedMB / Math.max(1, o.pct / 100)) });
    j.progress = o.pct; j.phase = o.phase || 'waiting';
    j.staged = o.stagedMB;
    return j;
  }
  function renderQueue() {
    const stand = state.jobs.filter(j => !j.colId && j.phase !== 'done');
    const ordered = ['downloading', 'merging', 'failed', 'waiting-drive', 'paused', 'waiting'].flatMap(p => stand.filter(j => j.phase === p));
    const rows = ordered.map(rowJob).join('') + state.cols.map(rowCol).join('');
    if (!state.sel || !((state.sel.type === 'job' && jobById(state.sel.id) && !jobById(state.sel.id).colId) || (state.sel.type === 'col' && colById(state.sel.id)))) {
      state.sel = ordered[0] ? { type: 'job', id: ordered[0].id } : (state.cols[0] ? { type: 'col', id: state.cols[0].id } : null);
    }
    const anyDown = state.jobs.some(j => j.phase === 'downloading');
    const anyPaused = state.jobs.some(j => j.phase === 'paused');
    qEl.innerHTML = rows ? `
      <div class="qwrap">
        <div class="qmaster">
          <header class="qhead"><h1>Queue</h1><div class="acts">
            <button class="btn sm ghost" data-act="pauseall" ${anyDown ? '' : 'disabled'}>Pause all</button>
            <button class="btn sm ghost" data-act="resumeall" ${anyPaused ? '' : 'disabled'}>Resume all</button>
          </div></header>
          <div class="qlist">${orphanCard() + rows}</div>
        </div>
        <aside class="qinsp">${inspHTML()}</aside>
      </div>` : `
      <div class="qempty"><div class="t">Nothing in the queue</div>

        <button class="btn pri" data-nav="home">Go to Home</button></div>`;
  }
  function inspHTML() {
    if (!state.sel) return '<div class="imeta">Select a job to see its details.</div>';
    if (state.sel.type === 'col') return inspCol(colById(state.sel.id));
    const j = jobById(state.sel.id); if (!j) return '';
    const fail = j.phase === 'failed';
    const buttons = j.phase === 'waiting-drive'
      ? `<button class="btn pri" data-act="reconnect">Reconnect drive</button><button class="btn ghost danger" data-act="cancel">Cancel</button>`
      : fail
      ? `<button class="btn pri" data-act="retry">Retry</button><button class="btn ghost danger" data-act="cancel">Cancel</button>`
      : j.phase === 'paused'
        ? `<button class="btn pri" data-act="resume">Resume</button><button class="btn ghost danger" data-act="cancel">Cancel</button>`
        : `<button class="btn ${j.phase === 'waiting' ? '' : 'pri'}" data-act="pause">Pause</button><button class="btn ghost danger" data-act="cancel">Cancel</button>`;
    return `<h3>${j.item.title}</h3>

        <div><dt>Progress</dt><dd id="v-prog">${Math.round(j.progress)}%</dd></div>
        <div><dt>Size</dt><dd>${fmtSize(j.sizeMB)}</dd></div>

      <div class="ibar"><i id="v-bar" style="width:${j.progress}%"></i></div>
      <div class="ipath">${(j.dst ? j.dst + '/' : state.folder + '/')}${j.item.title.toLowerCase().replace(/[^a-z0-9]+/g, '_')}${/MP3/.test(j.fmt) ? '.mp3' : /M4A|Opus/.test(j.fmt) ? '.m4a' : '.mp4'}</div>
      ${fail ? `<div class="ierr">ytdlp: HTTP Error 429: Too Many Requests<br>at fetch format list — ${j.item.title.toLowerCase().replace(/[^a-z0-9]+/g, '_')}<br>hint: wait or sign in for this source</div>
      <div class="ibtns">${buttons}<button class="btn sm ghost" data-act="copy">Copy details</button></div>` : ''}
      ${!fail ? `<div class="ibtns">${buttons}</div>` : ''}`;
  }
  function inspCol(c) {
    if (!c) return '';
    const s = colStats(c);
    const anyActive = s.kids.some(k => ['downloading', 'merging', 'waiting'].includes(k.phase));
    const live = s.kids.filter(k => ['downloading', 'merging'].includes(k.phase)).slice(0, 2);
    const waiting = s.kids.filter(k => k.phase === 'waiting').slice(0, 3);
    return `<h3>${c.title}</h3>
      <div class="imeta" id="c-meta">${s.done}/${s.kids.length} finished · ${anyActive ? s.speed.toFixed(1) + ' MB/s' : 'paused'}</div>
      <div class="ibar"><i id="c-bar" style="width:${s.agg}%"></i></div>
      <div class="kids">
        ${s.done ? `<div class="kid done"><span></span><span class="kt">✓ ${s.done} finished</span><span></span></div>` : ''}
        ${live.map(k => `<div class="kid live"><span></span><span class="kt">${k.item.title}<span class="kbar"><i style="width:${k.progress}%"></i></span></span><span class="kd">${k.speed.toFixed(1)} MB/s</span></div>`).join('')}
        ${waiting.map(k => `<div class="kid"><span></span><span class="kt">${k.item.title}</span><span class="kd">waiting</span></div>`).join('')}
      </div>
      <div class="ibtns"><button class="btn ${anyActive ? '' : 'pri'}" data-act="pause-col">${anyActive ? 'Pause collection' : 'Resume collection'}</button>
      <button class="btn ghost danger" data-act="cancel-col">Cancel</button></div>`;
  }
  qEl.addEventListener('click', e => {
    if (e.target.closest('[data-nav="home"]')) { go('home'); return; }
    const ob = e.target.closest('[data-or]');
    if (ob) {
      const act = ob.dataset.or;
      const o = ob.dataset.oid ? state.orphans.find(x => x.id === ob.dataset.oid) : null;
      if (act === 'dismiss') {
        state.orphans.forEach(x => orphanJob({ ...x, phase: 'paused' }));
        state.orphans = [];
        toast({ title: 'Kept for later', sub: 'Staged data preserved — rows stay in the queue', ms: 3000 });
      } else if (act === 'resume-all') {
        state.orphans.forEach(x => orphanJob(x));
        state.orphans = [];
        toast({ title: 'Resuming', sub: 'Picking up from checkpoints — nothing re-downloaded so far', ms: 3000 });
      } else if (act === 'resume' && o) {
        orphanJob(o);
        state.orphans = state.orphans.filter(x => x !== o);
        toast({ title: o.item.title, sub: `Resuming from checkpoint — ${o.pct}% already downloaded`, ms: 3000 });
      } else if (act === 'discard' && o && ob.dataset.arm) {
        o.confirm = true;
      } else if (act === 'discard' && o) {
        state.orphans = state.orphans.filter(x => x !== o);
        toast({ title: 'Discarded staged data', sub: `Freed ${fmtSize(o.stagedMB)} — the destination folder was never touched`, ms: 3200 });
      } else if (act === 'keep' && o) {
        o.confirm = false;
      }
      renderQueue();
      return;
    }
    const btn = e.target.closest('[data-act]');
    if (btn) { doAct(btn.dataset.act); return; }
    const row = e.target.closest('.qrow');
    if (row) {
      state.sel = row.dataset.job ? { type: 'job', id: row.dataset.job } : { type: 'col', id: row.dataset.col };

    }
  });
  qEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList.contains('qrow')) e.target.click();
    if (e.key === ' ' && e.target.classList.contains('qrow')) { e.preventDefault(); doAct('space'); }
  });
  function doAct(act) {
    const j = state.sel && state.sel.type === 'job' ? jobById(state.sel.id) : null;
    const c = state.sel && state.sel.type === 'col' ? colById(state.sel.id) : null;
    if (act === 'pauseall') state.jobs.forEach(x => { if (x.phase === 'downloading') x.phase = 'paused'; });
    if (act === 'resumeall') state.jobs.forEach(x => { if (x.phase === 'paused') x.phase = 'waiting'; });
    if (act === 'pause' && j) j.phase = 'paused';
    if (act === 'resume' && j) j.phase = 'waiting';
    if (act === 'space' && j) j.phase = j.phase === 'paused' ? 'waiting' : j.phase === 'downloading' ? 'paused' : j.phase;
    if (act === 'retry' && j) { j.retried = true; j.phase = 'downloading'; }
    if (act === 'reconnect' && j) { j.phase = 'waiting'; toast({ title: 'Drive reconnected', sub: `${j.item.title} — resuming automatically`, ms: 3000 }); }
    if (act === 'cancel' && j) cancelJob(j);
    if (act === 'cancel-col' && c) cancelCollection(c);
    if (act === 'pause-col' && c) {
      const kids = c.children.map(jobById).filter(Boolean);
      const anyActive = kids.some(k => ['downloading', 'merging', 'waiting'].includes(k.phase));
      kids.forEach(k => {
        if (anyActive && ['downloading', 'merging', 'waiting'].includes(k.phase)) k.phase = 'paused';
        else if (!anyActive && k.phase === 'paused') k.phase = 'waiting';
      });
    }
    if (act === 'copy' && j) {
      const txt = `ytdlp: HTTP Error 429: Too Many Requests\nat fetch format list — ${j.item.title}\nhint: wait or sign in for this source`;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => {});
      toast({ title: 'Error details copied', ms: 2500 });
    }
    if (state.sel && state.sel.type === 'job' && !jobById(state.sel.id)) state.sel = null;
    renderQueue(); renderChrome();
  }

  /* ---------- DOWNLOADS ---------- */
  const dEl = $('#scr-downloads');
  let dBuilt = false;
  function renderDownloads() {
    if (!dBuilt) {
      dEl.innerHTML = `<div style="display:flex;flex-direction:column;height:100%">
        <div class="dhead"><h1>Downloads</h1><input class="dsearch" id="dsearch" type="text" placeholder="Search · ⌘F"></div>
        <div class="dlist" id="dlist"></div>
      </div>`;

      dBuilt = true;
    }

  }
  function renderDList() {
    const q = ($('#dsearch').value || '').toLowerCase();
    const match = d => !q || (d.item.title + ' ' + d.item.channel).toLowerCase().includes(q);
    const grpMatch = g => !q || g.title.toLowerCase().includes(q) || g.items.some(d => (d.item.title + ' ' + (d.item.channel || g.channel)).toLowerCase().includes(q));
    const groups = [['Today', 'today'], ['Yesterday', 'yesterday'], ['Earlier', 'earlier']];
    let html = '';
    for (const [label, key] of groups) {
      const dgs = state.dgroups.filter(g => g.group === key && grpMatch(g));
      const items = state.downloads.filter(d => d.group === key && match(d));
      if (!dgs.length && !items.length) continue;
      html += `<div class="dgroup">${label}</div>`;
      html += dgs.map(g => {
        const open = q ? true : !!g.open;
        const total = g.items.reduce((s, d) => s + d.sizeMB, 0);
        const head = `<div class="drow grp" data-grp="${g.id}" tabindex="0" title="${open ? 'Hide episodes' : 'Show episodes'}">
          <span class="chev">${open ? '▾' : '▸'}</span><img src="${g.thumb}" alt="">
          <div><b>${g.title}</b><span>Playlist · ${g.items.length} episodes · ${g.fmt} · ${fmtSize(total)}</span></div>
          <div class="dact"><button class="btn sm ghost" data-rev-grp="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Reveal</button><button class="btn sm ghost" data-open-grp="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M9.5 5H6.5A2.5 2.5 0 0 0 4 7.5v9A2.5 2.5 0 0 0 6.5 19h9a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg>Open</button></div>
        </div>`;
        if (!open) return head;
        return head + g.items.map(d => `
          <div class="drow sub"><span class="epx">EP ${String(d.idx).padStart(2, '0')}</span><img src="${d.item.thumb}" alt="">
            <div><b>${d.item.title}</b><span>${d.item.dur} · ${fmtSize(d.sizeMB)}</span></div>
            <div class="dact"><button class="btn sm ghost" data-rev="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Reveal</button><button class="btn sm ghost" data-open="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M9.5 5H6.5A2.5 2.5 0 0 0 4 7.5v9A2.5 2.5 0 0 0 6.5 19h9a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg>Open</button></div>
          </div>`).join('');
      }).join('');
      html += items.map(d => `
        <div class="drow"><img src="${d.item.thumb}" alt="">
          <div><b>${d.item.title}</b><span>${d.fmt} · ${fmtSize(d.sizeMB)} · ${d.item.channel}</span></div>
          <div class="dact"><button class="btn sm ghost" data-rev="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Reveal</button><button class="btn sm ghost" data-open="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M9.5 5H6.5A2.5 2.5 0 0 0 4 7.5v9A2.5 2.5 0 0 0 6.5 19h9a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg>Open</button></div>
        </div>`).join('');
    }

  }
  dEl.addEventListener('click', e => {
    if (e.target.closest('[data-rev-grp]')) { toast({ title: 'Revealed playlist folder in Finder', ms: 2500 }); return; }
    if (e.target.closest('[data-open-grp]')) { toast({ title: 'Opened playlist folder', ms: 2500 }); return; }
    if (e.target.closest('[data-rev]')) { toast({ title: 'Revealed in Finder', ms: 2500 }); return; }

  });

  /* ---------- SETTINGS (merged with About) ---------- */
  const sEl = $('#scr-settings');
  const settings = { subfolder: true, confirm: false, concurrency: 2 };
  function renderSettings() {
    sEl.innerHTML = `<div class="spage"><div class="scol">
      <h1>Settings</h1>
      <div class="sgroup"><h2>Downloads</h2>
        <div class="srow"><div class="scopy"><strong>Default download folder</strong><span class="mono">~/Movies/VidStow</span></div>
          <div class="sact"><button class="btn sm ghost" data-set="finder">Show in Finder</button><button class="btn sm ghost" data-set="changedir">Change…</button></div></div>
        <div class="srow"><div class="scopy"><strong>Create a subfolder for each download</strong><span>Places all files for one video together.</span></div>

          <div class="sact"><button class="toggle ${settings.confirm ? 'on' : ''}" data-set="confirm">${settings.confirm ? 'On' : 'Off'}</button></div></div>
        <div class="srow"><div class="scopy"><strong>Concurrent downloads</strong><span>How many jobs transfer at once.</span></div>
          <div class="sact"><button class="btn sm ghost" data-set="dec">−</button><b>${settings.concurrency}</b><button class="btn sm ghost" data-set="inc">+</button></div></div>
        ${settings.concurrency > 4 ? `<p class="swarn">More than 4 concurrent downloads may trigger YouTube rate limits (HTTP 429).</p>` : ''}
      </div>
      <div class="sgroup"><h2>Engine</h2>
        <div class="srow"><div class="scopy"><strong>FFmpeg</strong><span>Version 7.1 · ready for merging and MP3 conversion.</span></div>
          <div class="sact"><em class="sbadge">Ready</em><button class="btn sm ghost" data-set="recheck">Recheck</button></div></div>
        <div class="srow"><div class="scopy"><strong>FFmpeg path</strong><span class="mono">/opt/homebrew/bin/ffmpeg</span></div>
          <div class="sact"><button class="btn sm ghost" data-set="changedir">Change…</button></div></div>
        <div class="srow"><div class="scopy"><strong>Engine</strong><span>ytdlp-go v0.3.0</span></div>
          <div class="sact"><em class="sbadge">Ready</em></div></div>
      </div>
      <div class="sgroup"><h2>Diagnostics</h2>
        <div class="srow"><div class="scopy"><strong>Send operational diagnostics</strong><span>When VidStow cannot complete a requested download, send a small sanitized report. Links, paths, and error text stay private.</span><small><span class="slink" data-set="privacy">Diagnostics privacy notice ↗</span></small></div>
          <div class="sact"><button class="btn sm ghost" data-set="send-diag">Send</button><button class="btn sm ghost" data-set="dont-diag">Don’t send</button></div></div>
        <div class="srow"><div class="scopy"><strong>Support report</strong><span>Includes app and FFmpeg status plus recent sanitized failures.</span></div>
          <div class="sact"><button class="btn sm ghost" data-set="copy-diag">Copy diagnostics</button><button class="btn sm ghost" data-set="clear-hist">Clear history</button></div></div>
      </div>
      <div class="colophon">
        <div class="cleft"><span class="cmark">V</span><div><b>VidStow</b><span>2.0.0-proto · Apache-2.0 · darwin/arm64</span></div></div>
        <div class="cact"><button class="btn sm ghost" data-set="source">View source</button><button class="btn sm ghost" data-set="docs">Read the docs</button></div>
        <div class="cbuilt">A tidy YouTube video, Short, and playlist downloader for the desktop. Built with Go · Wails · Svelte · ytdlp-go · FFmpeg</div>
      </div>
    </div></div>`;
  }
  sEl.addEventListener('click', e => {
    const t = e.target.closest('[data-set]');
    if (!t) return;
    const k = t.dataset.set;
    if (k === 'subfolder') settings.subfolder = !settings.subfolder;
    if (k === 'confirm') settings.confirm = !settings.confirm;
    if (k === 'inc') settings.concurrency = Math.min(10, settings.concurrency + 1);
    if (k === 'dec') settings.concurrency = Math.max(1, settings.concurrency - 1);
    state.slots = settings.concurrency;
    if (k === 'finder') { toast({ title: 'Revealed in Finder', ms: 2500 }); return; }
    if (k === 'changedir') { toast({ title: 'Choose a folder', ms: 2500 }); return; }
    if (k === 'recheck') { toast({ title: 'FFmpeg rechecked · Ready', ms: 2500 }); return; }
    if (k === 'send-diag') { toast({ title: 'Diagnostics will be sent', ms: 2500 }); return; }
    if (k === 'dont-diag') { toast({ title: 'Diagnostics will not be sent', ms: 2500 }); return; }
    if (k === 'copy-diag') { toast({ title: 'Diagnostics copied', ms: 2500 }); return; }
    if (k === 'clear-hist') { toast({ title: 'History cleared', ms: 2500 }); return; }
    if (k === 'privacy') { toast({ title: 'Diagnostics privacy notice', ms: 2500 }); return; }
    if (k === 'source' || k === 'docs') { toast({ title: 'Opens in your browser', ms: 2500 }); return; }
    renderSettings(); renderChrome();
  });

  /* ---------- toasts ---------- */
  function toast({ title, sub = '', actions = [], ms = 4200 }) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<b>${title}</b>${sub ? `<span>${sub}</span>` : ''}${actions.length ? `<div class="tact">${actions.map((a, i) => `<button class="btn sm ${a.primary ? 'pri' : 'ghost'}" data-t="${i}">${a.label}</button>`).join('')}</div>` : ''}`;
    $('#toasts').appendChild(t);
    const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 220); };
    const timer = setTimeout(kill, ms);
    t.addEventListener('click', e => {
      const b = e.target.closest('[data-t]');
      if (!b) return;
      clearTimeout(timer);
      const a = actions[+b.dataset.t];
      if (a && a.onClick) a.onClick();
      kill();
    });
  }

  /* ---------- statusbar ---------- */
  function statusbar() {
    const el = $('#sb-right');
    const act = state.jobs.filter(j => j.phase === 'downloading');
    if (act.length) el.textContent = `${act.reduce((s, j) => s + j.speed, 0).toFixed(1)} MB/s · ${act.length}/${state.slots} slots`;
    else el.textContent = 'Idle';
  }

  /* ---------- tick engine ---------- */
  function tick() {
    let structural = false;
    while (state.jobs.filter(j => j.phase === 'downloading' || j.phase === 'merging').length < state.slots) {
      const nx = state.jobs.find(j => j.phase === 'waiting');
      if (!nx) break; nx.phase = 'downloading'; structural = true;
    }
    for (const j of state.jobs) {
      if (j.phase === 'downloading') {
        if (j.item.failAt != null && !j.retried && j.progress >= j.item.failAt) {
          j.phase = 'failed'; j.error = 'HTTP 429'; structural = true; continue;
        }
        j.speed = j.base * (0.7 + Math.random() * 0.6);
        j.progress = Math.min(100, j.progress + j.rate);
        if (j.progress >= 100) { j.phase = 'merging'; j.mergeT = 4; structural = true; }
      } else if (j.phase === 'merging') {
        j.mergeT--; if (j.mergeT <= 0) { finishJob(j); structural = true; }
      }
    }
    if (structural) {
      renderChrome();
      if (state.route === 'queue') renderQueue();
      if (state.route === 'downloads') renderDList();
    } else {
      tickDyn();
    }
    statusbar();
  }
  function tickDyn() {
    if (state.route !== 'queue') return;
    state.jobs.forEach(j => {
      if (j.colId) return;
      const el = document.querySelector(`[data-job="${j.id}"]`);
      if (el) {
        const bar = el.querySelector('.qbar i'); if (bar) bar.style.width = j.progress + '%';
        const tail = el.querySelector('.qtail'); if (tail) tail.textContent = tailFor(j);
      }
    });
    state.cols.forEach(c => {
      const el = document.querySelector(`[data-col="${c.id}"]`);
      if (!el) return;
      const s = colStats(c);
      const bar = el.querySelector('.qbar i'); if (bar) bar.style.width = s.agg + '%';
      const tail = el.querySelector('.qtail'); if (tail) tail.textContent = s.anyActive ? `${s.done}/${s.kids.length} · ${s.speed.toFixed(1)} MB/s` : `${s.done}/${s.kids.length} · paused`;
    });
    const j = state.sel && state.sel.type === 'job' ? jobById(state.sel.id) : null;
    if (j && !j.colId) {
      const sp = $('#v-speed'), et = $('#v-eta'), pg = $('#v-prog'), br = $('#v-bar');
      if (sp) sp.textContent = j.phase === 'failed' ? '—' : j.speed.toFixed(1) + ' MB/s';
      if (et) et.textContent = j.phase === 'failed' ? '—' : etaFor(j);
      if (pg) pg.textContent = Math.round(j.progress) + '%';
      if (br) br.style.width = j.progress + '%';
    }
    const c = state.sel && state.sel.type === 'col' ? colById(state.sel.id) : null;
    if (c) {
      const s = colStats(c);
      const m = $('#c-meta'), br = $('#c-bar');
      if (m) m.textContent = `${s.done}/${s.kids.length} finished · ${s.anyActive ? s.speed.toFixed(1) + ' MB/s' : 'paused'}`;
      if (br) br.style.width = s.agg + '%';
    }
  }

  /* ---------- keyboard ---------- */
  addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'l') { e.preventDefault(); go('home'); field.focus(); field.select(); }
    else if (mod && ['1', '2', '3'].includes(e.key)) { e.preventDefault(); go(['home', 'queue', 'downloads'][+e.key - 1]); }
    else if (mod && e.key === ',') { e.preventDefault(); go('settings'); }
    else if (mod && e.key.toLowerCase() === 'f' && state.route === 'downloads') { e.preventDefault(); const s = $('#dsearch'); s && s.focus(); }
    else if (e.key === 'Escape' && state.route === 'home') {
      if (state.folderOpen) { state.folderOpen = false; renderSlot(); }
      else if (['result', 'error', 'added', 'scope'].includes(state.homePhase)) resetHome();
    }
    else if (['ArrowDown', 'ArrowUp'].includes(e.key) && state.route === 'home' && state.homePhase === 'scope') {
      e.preventDefault();
      const cards = [...document.querySelectorAll('.scard')];
      if (!cards.length) return;
      const i = cards.indexOf(document.activeElement);
      const next = e.key === 'ArrowDown' ? (i + 1) % cards.length : (i - 1 + cards.length) % cards.length;
      cards[i < 0 ? (e.key === 'ArrowDown' ? 0 : cards.length - 1) : next].focus();
    }
  });

  /* ---------- init ---------- */
  buildHome();
  state.downloads.push(
    { item: byId('go'), fmt: '2160p', sizeMB: POLICY['2160p'](26), group: 'yesterday' },
    { item: byId('tracing'), fmt: '1080p', sizeMB: POLICY['1080p'](10), group: 'yesterday' },
    { item: byId('podcast'), fmt: 'M4A', sizeMB: POLICY['Audio'](48), group: 'earlier' },
    { item: byId('chaos'), fmt: '1080p', sizeMB: POLICY['1080p'](11), group: 'earlier' },
    { item: byId('clocks'), fmt: '720p', sizeMB: POLICY['720p'](15), group: 'earlier' }
  );
  state.dgroups.push({
    id: 'dg0', title: 'Concurrency in Go', channel: 'Steve Hook', thumb: PLAYLIST_EPS[0].thumb, fmt: '1080p', group: 'yesterday', open: false,
    items: PLAYLIST_EPS.map((ep, i) => ({ item: { id: 'pl' + (i + 1), title: ep.t, channel: 'Steve Hook', dur: ep.d, thumb: ep.thumb }, fmt: '1080p', sizeMB: epPlan(ep, 'video', '1080p').sizeMB, idx: i + 1 }))
  });
  state.orphans.push(
    { id: 'o1', item: { title: 'Rust vs Go Architecture 2026', channel: 'Systems Weekly', dur: '18:41', thumb: 'thumbs/rust.jpg', fmt: '1080p' }, stagedMB: 843, pct: 62, totalMB: 1360 },
    { id: 'o2', item: { title: 'Concurrency in Go — EP 3 · Channels in Depth', channel: 'Steve Hook', dur: '22:41', thumb: 'thumbs/pl3.jpg', fmt: '1080p' }, stagedMB: 210, pct: 31, totalMB: 678 }
  );
  const jw = addJob(byId('servers'), POLICY['1080p'](14)); jw.phase = 'waiting-drive'; jw.progress = 38; jw.vol = 'SanDisk 64GB'; jw.dst = '/Volumes/SanDisk 64GB/VidStow';
  const j1 = addJob(byId('concurrency'), POLICY['1080p'](12)); j1.phase = 'downloading'; j1.progress = 55;
  addJob(byId('rust'), POLICY['1080p'](18));
  renderChrome();
  go('home');
  setInterval(tick, 600);
})();
</script>
</body>
</html>
